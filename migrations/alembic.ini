# A generic, single database configuration.

[alembic]
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# The SQLAlchemy URL for the database. This is the same as
# the Flask-SQLAlchemy 'SQLALCHEMY_DATABASE_URI' config variable.
# Example for SQLite:
sqlalchemy.url = sqlite:///site.db
# Example for PostgreSQL:
# sqlalchemy.url = postgresql://user:pass@host/dbname
# Example for MySQL:
# sqlalchemy.url = mysql+pymysql://user:pass@host/dbname


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
